# Netlify build settings for the IM Lesson Plan Builder.
# The site is plain HTML with no build step and no server code.
[build]
  command = ""
  publish = "site"
  # No server functions: point Netlify at an empty folder so it ignores any
  # leftover netlify/edge-functions folder in the repo.
  edge_functions = "no-edge-functions"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    Referrer-Policy = "same-origin"
